function interview(){state.view='interview';const c=state.chart,p=state.profile;$('#main').innerHTML=`<div class="workspace">${flowAside(2)}<div><div class="reveal"><div class="eyebrow">YOUR ORIGINAL TRACK · ${esc(c.input.name)}</div><h2>${character(c)}</h2>${pillars(c)}<p>일간 ${Saju.G[c.dm]} · ${Saju.E[Math.floor(c.dm/2)]}의 전통적 상징이에요.<br>실제 성향은 오행의 분포와 역할을 함께 봅니다.</p><span class="badge">검증 ${c.checks.filter(x=>x.ok).length}/8</span> ${c.input.unknown?'<span class="badge warning">시주 불명 · C</span>':''} ${c.boundary?'<span class="badge warning">경계 출생 · C</span>':''}<p>${esc(c.solar)} ${c.input.unknown?'시각 모름':esc(c.input.time)} · ${esc(c.input.region||'국내 출생 가정')} · 만 ${c.age}세</p></div><form class="form-card" id="interview-form"><h2>어디가, 언제가 궁금하세요?</h2><p class="intro">이 화면에서 한 번만 물어볼게요.<br>지금의 나에게 필요한 이야기만 골라주세요.</p><div class="question"><h3><small>01</small>특히 궁금한 분야는?</h3><p class="hint">여러 개 골라도 좋아요.</p><div class="choice-grid" id="field-options"></div><button type="button" class="more" id="toggle-other">+ 다른 관심사 직접 쓰기</button><div class="form-group" id="other-wrap" hidden style="margin-top:6px"><input id="other-interest" maxlength="80" placeholder="예: 진로, 가족, 궁합, 프로젝트 리본" value="${esc(p.other)}" aria-label="기타 관심 분야"></div></div><div class="question"><h3><small>02</small>어느 기간을 펼쳐볼까요?</h3><p class="hint">선택하지 않으면 앞으로 3개월이에요.</p><div class="choice-grid">${[['week','오늘 · 이번 주'],['month','이번 달'],['quarter','앞으로 3개월'],['more','다른 기간 보기 +']].map(([key,t])=>`<button type="button" class="choice ${p.period===key?'selected':''}" data-period="${key}" aria-pressed="${p.period===key}">${t}</button>`).join('')}</div><div class="form-group" id="more-period" hidden style="margin-top:10px"><select id="period-select" aria-label="다른 기간 선택"><option value="year">올해 남은 기간</option><option value="next">내년</option><option value="long">향후 5년</option></select></div></div><div class="question"><h3><small>03</small>지금의 나는?</h3><p class="hint">만 나이로 고른 기본값이에요. 지금 상황에 맞춰 바꿔주세요.</p><div class="choice-grid">${Object.entries(situations).slice(0,4).map(([k,v])=>`<button type="button" class="choice ${p.situation===k?'selected':''}" data-situation="${k}" aria-pressed="${p.situation===k}">${v}</button>`).join('')}</div><button type="button" class="more" data-situation="rest">${p.situation==='rest'?'✓ ':''}쉬는 중 · 기타</button><label class="checkbox" id="weekend-wrap" ${p.situation==='business'?'':'hidden'}><input type="checkbox" id="weekend-business">주말에도 영업해요</label></div><div id="conditional-question"></div><div class="error" id="interview-error" role="alert"></div><button class="primary" type="submit">나의 리포트 펼치기 <span class="arrow">↗</span></button><button type="button" class="more" id="skip-interview" style="margin:12px auto 0">기본 설정으로 바로 보기</button></form></div></div>`;drawFields();drawConditional();gotoTop();
  $('#toggle-other').onclick=()=>{$('#other-wrap').hidden=!$('#other-wrap').hidden;if(!$('#other-wrap').hidden)$('#other-interest').focus();};
  $('#other-interest').oninput=e=>{p.other=e.target.value;drawConditional();};
  $$('[data-period]').forEach(btn=>btn.onclick=()=>{const more=btn.dataset.period==='more';p.period=more?$('#period-select').value:btn.dataset.period;$('#more-period').hidden=!more;$$('[data-period]').forEach(x=>{x.classList.toggle('selected',x===btn);x.setAttribute('aria-pressed',x===btn);});});
  $('#period-select').onchange=e=>p.period=e.target.value;
  $$('[data-situation]').forEach(btn=>btn.onclick=()=>{p.situation=btn.dataset.situation;p.fields=[...Saju.situationFields[p.situation]];$$('[data-situation]').forEach(x=>{x.classList.toggle('selected',x===btn);x.setAttribute('aria-pressed',x===btn);});$('#weekend-wrap').hidden=p.situation!=='business';drawFields();drawConditional();});
  $('#interview-form').onsubmit=e=>{e.preventDefault();finishInterview(false);};$('#skip-interview').onclick=()=>finishInterview(true);
}
function drawFields(){const p=state.profile;$('#field-options').innerHTML=Saju.situationFields[p.situation].map(f=>`<button type="button" class="choice ${p.fields.includes(f)?'selected':''}" data-field-option="${f}" aria-pressed="${p.fields.includes(f)}"><span class="icon">${icons[f]}</span>${p.situation==='student'&&f===0?'진로·적성':p.situation==='rest'&&f===4?'가족':Saju.fields[f]}</button>`).join('');$$('[data-field-option]').forEach(btn=>btn.onclick=()=>{const f=+btn.dataset.fieldOption;p.fields=p.fields.includes(f)?p.fields.filter(x=>x!==f):[...p.fields,f];drawFields();drawConditional();});}
function q4Kind(){const p=state.profile;if(p.other.includes('궁합'))return 'partner';if(p.fields.some(f=>[1,5].includes(f))||p.other.includes('날짜'))return 'dates';if(state.chart.provisional)return 'events';if(/프로젝트|과제|사업명/.test(p.other))return 'tasks';return null;}
function drawConditional(){const kind=q4Kind(),el=$('#conditional-question');if(el.dataset.kind===kind)return;el.dataset.kind=kind||'';if(!kind){el.innerHTML='';return;}const head='<h3>04 · ';el.innerHTML=`<div class="q4">${kind==='dates'?`${head}정해둔 날짜가 있나요?</h3><p class="hint">면접·시험·계약일 후보, 최대 5개. 없어도 괜찮아요.<br>주말 시험은 ‘개인 시험 일정’을 체크해 주세요.</p><div class="form-group">${Array.from({length:3},(_,i)=>`<input type="date" class="candidate-date" aria-label="날짜 후보 ${i+1}" min="${Saju.today()}" max="2050-12-31" style="margin-top:6px">`).join('')}<button type="button" class="more" id="more-dates">+ 날짜 추가</button><label class="checkbox"><input type="checkbox" id="personal-exam">개인 시험 일정이에요</label></div>`:kind==='events'?`${head}기억에 남는 해가 있나요?</h3><p class="hint">신강지수가 경계에 있어요. 좋았던 해·힘들었던 해 2~3개로 역할 후보를 대조해요. 건너뛰면 잠정 역할표로 표시해요.</p><div class="form-group">${Array.from({length:3},(_,i)=>`<div class="event-row"><input type="number" class="event-year" min="${state.chart.solar.slice(0,4)}" max="${Saju.today().slice(0,4)}" placeholder="연도" aria-label="과거 사건 연도 ${i+1}"><select class="event-kind" aria-label="과거 사건 성격 ${i+1}"><option value="good">좋았던 해</option><option value="bad">힘들었던 해</option></select></div>`).join('')}</div>`:kind==='tasks'?`${head}어떤 과제를 추적할까요?</h3><p class="hint">같은 성격의 과제 최대 3개를 쉼표로 구분해 주세요.</p><div class="form-group"><input id="task-names" placeholder="예: 리본, LINK" maxlength="100" aria-label="과제 이름"><select id="task-type" aria-label="과제 성격" style="margin-top:8px"><option value="sales">수익·영업 사업</option><option value="plan">기획·확대·문서</option><option value="startup">창업·신사업</option><option value="exam">시험·자격</option><option value="job">이직 준비</option></select></div>`:`${head}상대의 태어난 순간은?</h3><p class="hint">궁합을 위해 상대의 입력도 같은 기준으로 검증해요.</p><div class="form-group partner-inputs"><div class="input-row"><input type="date" id="partner-date" aria-label="상대 양력 생년월일"><input type="time" id="partner-time" aria-label="상대 출생 시각"></div><label class="checkbox"><input type="checkbox" id="partner-unknown">상대 시각 모름</label><select id="partner-gender" aria-label="상대 성별" style="margin-top:8px"><option value="">성별 선택</option><option value="female">여성</option><option value="male">남성</option></select><input id="partner-region" placeholder="출생 지역 (미입력 시 국내)" aria-label="상대 출생 지역" style="margin-top:8px"><input id="partner-zone" placeholder="시간대 · 기본 Asia/Seoul" aria-label="상대 출생 시간대" style="margin-top:8px"><p class="hint">상대 생일은 양력으로 입력해 주세요.</p></div>`}</div>`;if(kind==='dates')$('#more-dates').onclick=()=>{const count=$$('.candidate-date').length;if(count<5)$('#more-dates').insertAdjacentHTML('beforebegin',`<input type="date" class="candidate-date" min="${Saju.today()}" max="2050-12-31" aria-label="날짜 후보 ${count+1}" style="margin-top:6px">`);if(count>=4)$('#more-dates').hidden=true;};}
function finishInterview(skip){const p=state.profile;try{if(skip){p.defaults=true;p.period='quarter';p.fields=[...Saju.situationFields[p.situation]];p.other='';}else{if(!p.fields.length)p.fields=[...Saju.situationFields[p.situation]];p.weekendBusiness=p.situation==='business'&&$('#weekend-business').checked;const kind=q4Kind();p.dates=kind==='dates'?[...new Set($$('.candidate-date').map(x=>x.value).filter(Boolean))]:[];if(p.dates.some(s=>s<Saju.today()||s>'2050-12-31'))throw Error('날짜 후보는 오늘부터 2050년까지 입력해 주세요.');p.personalExam=kind==='dates'&&$('#personal-exam').checked;p.events=kind==='events'?$$('.event-year').map((x,i)=>({year:+x.value,kind:$$('.event-kind')[i].value})).filter(x=>x.year):[];if(p.events.some(e=>e.year<+state.chart.solar.slice(0,4)||e.year>+Saju.today().slice(0,4)))throw Error('과거 사건은 출생 연도부터 올해까지 입력해 주세요.');if(kind==='tasks'){const names=$('#task-names').value.split(',').map(x=>x.trim()).filter(Boolean);if(names.length>3)throw Error('과제는 최대 3개까지 입력해 주세요.');p.tasks=names.map(name=>({name,type:$('#task-type').value}));}if(kind==='partner'){p.partner=Saju.chart({name:'상대',date:$('#partner-date').value,time:$('#partner-time').value,unknown:$('#partner-unknown').checked,gender:$('#partner-gender').value,calendar:'solar',zone:$('#partner-zone').value.trim()||'Asia/Seoul',region:$('#partner-region').value.trim()});}}
    if(p.other){const maps=[[/건강|체력/,6],[/가족|관계|친구/,7],[/학업|시험|진학/,5],[/금전|재물|투자/,3],[/연애|결혼|궁합/,4],[/이직|취업/,1],[/사업|창업/,2],[/진로|적성|승진/,0]];for(const [re,f] of maps)if(re.test(p.other)&&!p.fields.includes(f))p.fields.push(f);}
    state.data=Saju.report(state.chart,p);state.month=state.data.months[0].key;state.field='all';state.list='best';renderReport();
  }catch(err){$('#interview-error').textContent=err.message;$('#interview-error').scrollIntoView({block:'center',behavior:'smooth'});}}
function sample(){try{state.sample=true;state.birth={name:'리듬',date:'1995-08-17',calendar:'solar',time:'10:30',unknown:false,gender:'female',region:'서울',zone:'Asia/Seoul'};state.chart=Saju.chart(state.birth);state.profile={situation:'worker',fields:[0,3,4],period:'quarter',dates:[],events:[],other:'',weekendBusiness:false};state.data=Saju.report(state.chart,state.profile);state.month=state.data.months[0].key;state.field='all';state.list='best';renderReport();}catch(e){toast(e.message);}}
function selectedScore(r,f=state.field){return f==='all'?r.score:r.fields[+f].score;}
function relevantEligible(r,f=state.field){const p=state.data.profile;if(f==='all')return p.fields.some(x=>x<4)?Saju.eligible(r,0,p):true;return Saju.eligible(r,+f,p);}
function upcoming(f=state.field){return state.data.days.filter(r=>r.date>=state.data.created&&relevantEligible(r,f));}
function dateShort(s){return `${+s.slice(5,7)}.${+s.slice(8,10)}`;}
function weekday(s){return '일월화수목금토'[new Date(Saju.dayms(s)).getUTCDay()];}
function fieldLabel(f){const s=state.data.profile.situation;return f==='all'?'전체 흐름':s==='student'&&+f===0?'진로·적성':s==='rest'&&+f===4?'가족':Saju.fields[+f];}
function ring(n){return `<div class="score-ring" aria-label="오늘 ${n}점 ${Saju.grade(n)[0]}"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="#17121e19" stroke-width="7"/><circle cx="60" cy="60" r="52" fill="none" stroke="#17121e" stroke-width="7" stroke-linecap="round" stroke-dasharray="${n/100*326.73} 326.73"/></svg><div class="ring-number"><b>${n}</b><span>${Saju.grade(n)[0]} · 오늘 점수</span></div></div>`;}
function elementDonut(c){const total=c.counts.reduce((a,b)=>a+b,0);let offset=0;return `<div class="elements"><div class="donut"><svg viewBox="0 0 120 120" aria-label="오행 분포">${c.counts.map((n,i)=>{const len=n/total*301.59,out=`<circle cx="60" cy="60" r="48" fill="none" stroke="${Saju.EC[i]}" stroke-width="17" stroke-dasharray="${len} 301.59" stroke-dashoffset="${-offset}"/>`;offset+=len;return out;}).join('')}</svg><div class="donut-label"><b>${Saju.E[c.counts.indexOf(Math.max(...c.counts))]}의 리듬</b><small>원국 ${total}글자 기준</small></div></div><div class="element-list">${c.counts.map((n,i)=>`<div class="${n===0?'zero':''}"><i style="background:${Saju.EC[i]}"></i>${Saju.E[i]}<b>${c.percentages[i]}%</b></div>`).join('')}</div></div>`;}
const taskWeights={sales:[0.45,0,0,0.45,0,0,0,.1],plan:[.45,0,0,0,0,.45,0,.1],startup:[0,0,.5,.3,0,0,0,.2],exam:[0,0,0,0,0,.7,.3,0],job:[.3,.5,0,0,0,0,0,.2]};
function taskScore(row,t){return Math.round(row.fields.reduce((a,f,i)=>a+f.score*taskWeights[t.type][i],0));}
function fieldCards(){const d=state.data,ts=d.today,p=d.profile;if(p.tasks?.length)return p.tasks.map(t=>{const n=taskScore(ts,t),best=d.days.filter(r=>r.date>=d.created&&Saju.eligible(r,t.type==='exam'?5:0,p)).sort((a,b)=>taskScore(b,t)-taskScore(a,t))[0];return `<button class="field-card" data-detail="${ts.date}"><div class="field-name">✳ ${esc(t.name)}</div><div class="field-number">${n}<small>${Saju.grade(n)[0]}</small></div><div class="next-day">다음 상대 추천일<br><b>${best?dateShort(best.date):'기간 내 없음'}</b></div></button>`;}).join('');return p.fields.map(f=>{const n=ts.fields[f].score,best=upcoming(String(f)).sort((a,b)=>b.fields[f].score-a.fields[f].score)[0];return `<button class="field-card" data-detail="${ts.date}" data-detail-field="${f}"><div class="field-name">${icons[f]} ${fieldLabel(f)}</div><div class="field-number">${n}<small>${Saju.grade(n)[0]}</small></div><div class="next-day">${best&&best.fields[f].score>=70?'다음 좋은 날':'기간 내 상대 추천일'}<br><b>${best?dateShort(best.date)+' '+weekday(best.date):'기간 내 없음'}</b></div></button>`;}).join('');}
function flowContent(){const d=state.data,p=d.profile,conf=d.chart.input.unknown||d.chart.boundary?'C':'B';if(p.period==='week')return `<div class="report-heading"><h2>7일, 나의 템포</h2><small>일별 확신도 C</small></div><div class="week-cards">${d.days.map(r=>`<button class="week-card" data-detail="${r.date}">${dateShort(r.date)} ${weekday(r.date)}<b>${r.score}</b><small>${Saju.grade(r.score)[0]}</small></button>`).join('')}</div><div class="flow-summary">무리하게 속도를 올리기보다, 날짜별 차이를 확인해요. <span class="badge">C</span></div>`;
 const rows=p.period==='long'?d.years:d.months,highest=[...rows].sort((a,b)=>b.score-a.score)[0],lowest=[...rows].sort((a,b)=>a.score-b.score)[0];return `<div class="report-heading"><h2>${p.period==='long'?'해마다 달라지는 템포':'월별로 보는 나의 템포'}</h2><small>${d.average}점 · 기간 평균</small></div><div class="bar-chart">${rows.map(r=>`<button class="bar-col" data-flow-detail="${r.date}" data-layer="${p.period==='long'?'year':'month'}" aria-label="${r.year||r.key} ${r.score}점 ${Saju.grade(r.score)[0]}"><div class="bar-stick" style="height:${Math.max(8,r.score)}%"><b class="bar-value">${r.score}</b></div><span class="bar-label">${r.year?String(r.year).slice(2)+'년':+r.key.slice(5)+'월'}</span></button>`).join('')}</div><div class="flow-summary"><p><b>${highest.year||(+highest.key.slice(5)+'월')}</b>의 바탕이 ${highest.score}점으로 가장 높아요. <span class="badge">${conf}</span></p><p><b>${lowest.year||(+lowest.key.slice(5)+'월')}</b>은 ${lowest.score}점. ${lowest.score<40?'일정에 여유를 남겨두세요.':'진행 상황을 한 번 더 점검해요.'} <span class="badge">${conf}</span></p><p>${Saju.text(d.today.daewoonInfo.pair)} 대운 · ${d.today.daewoonInfo.pre?'대운 시작 전 기준 50점':d.today.daewoonInfo.end+'년 교체 예정'}. <span class="badge">${conf}</span></p></div>${p.period==='long'?`<div class="flow-summary">${rows.map(r=>`<p>${r.year} · ${r.score}점 ${Saju.grade(r.score)[0]} · ${r.daewoonInfo.start===r.year?'대운 교체 · ':''}${r.score>=55?'진행하던 일의 실행 범위를 점검해요.':'일정을 좁히고 기초를 점검해요.'} <span class="badge">${conf}</span></p>`).join('')}<p>상대적으로 유리한 해 TOP 2: ${[...rows].sort((a,b)=>b.score-a.score).slice(0,2).map(r=>r.year).join(', ')}</p></div>`:''}${['year','next'].includes(p.period)?`<div class="flow-summary">${p.fields.map(f=>{const sorted=[...rows].sort((a,b)=>b.fields[f].score-a.fields[f].score);return `<p>${fieldLabel(f)} · 최고 ${+sorted[0].key.slice(5)}월 ${sorted[0].fields[f].score} / 최저 ${+sorted.at(-1).key.slice(5)}월 ${sorted.at(-1).fields[f].score} <span class="badge">${conf}</span></p>`;}).join('')}</div>`:''}`;
}
function renderReport(scroll=true){state.view='report';const d=state.data,c=d.chart,p=d.profile,advice=Saju.advice(d.today,p.fields[0],p.situation),dw=d.today.daewoonInfo;$('#main').innerHTML=`<div class="report-shell"><div class="report-top"><span class="eyebrow">YOUR PERSONAL REPLAY</span><button data-action="${state.snapshot?'home':'interview'}">${state.snapshot?'새로 시작하기':'관심사 바꾸기 ↗'}</button></div>${state.sample?'<div class="sample-note"><b>샘플 리포트</b> · 가상 인물 ‘리듬’<br>1995.08.17 10:30 양력 · 여성 · 서울의 입력으로 계산했어요.</div>':''}${state.snapshot?'<div class="sample-note">저장된 리포트 · '+d.created+' 기준<br>날짜와 점수는 저장 당시의 결과예요.</div>':''}${p.defaults?'<div class="sample-note">기본 설정 적용 · 앞으로 3개월 · 상황별 대표 4분야</div>':''}${!c.input.region?'<div class="sample-note">출생 지역 미입력 · 국내 출생(KST)으로 계산했어요.</div>':''}<section class="report-hero"><div class="eyebrow"><i class="dot"></i> ${d.created.replaceAll('-','.')} · MY RHYTHM</div><h1>${esc(c.input.name)}님의<br>${periods[p.period]},</h1><p class="date-line">${p.fields.map(f=>fieldLabel(f)).join(' · ')}</p><div class="hero-score"><div><h2>${d.today.score>=70?'지금의 리듬을<br>잘 타볼 시간.':d.today.score>=55?'차근차근,<br>나의 페이스로.':d.today.score>=40?'속도를 고르고,<br>한 박자씩.':'잠깐의 쉼도<br>나의 리듬.'}</h2><p class="small-copy">${c.input.unknown?'시주를 제외한 3주 분석이에요.':c.provisional?'용신 후보가 갈리는 경계예요. 잠정 역할표로 봐주세요.':'오늘의 점수는 일진과 월 바탕을 합쳐 계산했어요.'}</p><span class="score-grade">확신도 C · 일별 경향</span></div>${ring(d.today.score)}</div></section><div class="advice-row"><div><b>DO</b><span>${advice.do}</span></div><div><b>PAUSE</b><span>${advice.avoid}</span></div></div><section class="report-section"><div class="report-heading"><h2>${p.tasks?.length?'진행 중인 나의 과제':'지금 관심 있는 트랙'}</h2><small>오늘 기준 · C</small></div><div class="cards-scroll">${fieldCards()}</div>${p.other?`<p class="task-badge">직접 적은 관심사: ${esc(p.other)} · 가까운 분야에 반영</p>`:''}</section><section class="report-section white-card"><div class="report-heading"><h2>${c.input.unknown?'나를 담은 여섯 글자':'내가 시작된 여덟 글자'}</h2><small>MY SAJU</small></div>${pillars(c)}<p class="character">${character(c)}</p><p class="chart-caption">일간의 전통적 상징 · ${c.input.unknown?'시주 불명 · ':''}${c.boundary?'경계 출생 · ':''}만 ${c.age}세 · ${c.forward?'순행':'역행'} 대운</p></section><section class="report-section white-card"><div class="report-heading"><h2>내 안의 다섯 가지 색</h2><small>FIVE ELEMENTS</small></div>${elementDonut(c)}<div class="role-explain"><b>${c.provisional?'잠정 ':''}용신 ${Saju.E[c.roles.indexOf(0)]}</b> · ${c.strong?'강한 일간의 기운을 표현·결과로 나누는 역할':'일간을 뒷받침하는 자원을 보완하는 역할'}<br>신강지수 ${c.strength} · ${c.provisional?'경계 구간, 후보별 해석 가능':'보완 규칙 적용'} · 확신도 ${c.input.unknown||c.boundary?'C':'B'}</div></section><section class="report-section flow-card">${flowContent()}</section>${p.partner?compatibilityCard(c,p.partner):''}<section class="report-section"><div class="report-heading"><h2>나의 타이밍 캘린더</h2><small>날짜를 눌러 자세히</small></div><div class="calendar-card" id="calendar-card"></div></section><section class="report-section"><div class="report-heading"><h2>기억해둘 날짜</h2><small id="list-field-name">${fieldLabel(state.field)}</small></div><div class="list-tabs"><button data-list="best" class="${state.list==='best'?'active':''}">좋은 날 · 상대 추천</button><button data-list="pause" class="${state.list==='pause'?'active':''}">미뤄볼 날</button></div><div id="date-list" class="date-list"></div><p class="ranking-hint">${p.fields.some(f=>f<4)&&!p.weekendBusiness?'업무 분야는 평일·공휴일 제외. ':''}절대 점수와 기간 내 상대 순위를 함께 봐주세요. · C</p></section>${d.comparisons.length?`<section class="report-section"><div class="report-heading"><h2>내가 고른 날짜 비교</h2><small>후보 ${d.comparisons.length}개 · C</small></div><div class="date-list">${[...d.comparisons].sort((a,b)=>b.fields[p.fields[0]].score-a.fields[p.fields[0]].score).map((r,i)=>dateItem(r,String(p.fields[0]),`${i+1}순위 · ${r.eligible||p.personalExam?'입력한 후보일':'업무 추천 제외 · 휴일'}`)).join('')}</div></section>`:''}${audit(d)}<div class="report-actions"><button data-action="download-html">리포트 HTML 저장 ↓</button><button data-action="download-json">계산 데이터 JSON ↓</button></div><p class="report-footer">명리학적 경향 분석이며 예언이 아닙니다<br>건강은 진단, 금전은 투자 판단을 대신하지 않습니다.</p><button class="text-button" data-action="start" style="display:block;margin:0 auto">${state.sample?'내 사주도 펼쳐보기 ↗':'새로운 사주 펼쳐보기 ↗'}</button></div>`;renderCalendar();renderDates();if(scroll)gotoTop();}
function renderCalendar(){const d=state.data,[y,m]=state.month.split('-').map(Number),rows=d.days.filter(r=>r.date.startsWith(state.month));const first=new Date(Date.UTC(y,m-1,1)).getUTCDay();const termDates=new Set(CAL.terms.map(t=>Saju.dateKST(t[0]).slice(0,10)));$('#calendar-card').innerHTML=`<div class="cal-sticky"><div class="month-row"><strong>${y}년 ${m}월</strong><button data-month-move="-1" aria-label="이전 달" ${state.month===d.months[0].key?'disabled':''}>‹</button><button data-month-move="1" aria-label="다음 달" ${state.month===d.months.at(-1).key?'disabled':''}>›</button></div>${d.months.length>1?`<div class="month-tabs" aria-label="월 선택">${d.months.map(r=>`<button data-month="${r.key}" class="${r.key===state.month?'active':''}" aria-pressed="${r.key===state.month}">${d.months.length>12?r.key.replace('-','.'):Number(r.key.slice(5))+'월'}</button>`).join('')}</div>`:''}<div class="field-chips" aria-label="관심 분야 필터">${['all',...d.profile.fields].map(f=>`<button data-filter="${f}" class="${String(f)===state.field?'active':''}" aria-pressed="${String(f)===state.field}">${fieldLabel(f)}</button>`).join('')}</div></div><div class="calendar"><div class="weekdays">${'일월화수목금토'.split('').map(s=>`<span>${s}</span>`).join('')}</div><div class="date-grid">${'<span></span>'.repeat(first)}${Array.from({length:new Date(Date.UTC(y,m,0)).getUTCDate()},(_,i)=>{const s=`${y}-${String(m).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,r=rows.find(x=>x.date===s);if(!r)return `<span style="text-align:center;padding:10px 0;color:#c0b5ca;font-size:9px">${i+1}</span>`;const n=selectedScore(r),[g,color]=Saju.grade(n),weekend=[0,6].includes(new Date(Saju.dayms(s)).getUTCDay());return `<button class="day-cell ${s===d.created?'today':''} ${s<d.created?'past':''} ${weekend?'weekend':''} ${termDates.has(s)?'term':''} ${r.raw.void?'void':''}" style="--cell:${color}" data-grade="${g}" data-detail="${s}" aria-label="${m}월 ${i+1}일 ${n}점 ${g}${r.holiday?' '+esc(r.holiday):''}"><span class="day-num">${i+1}</span><b class="day-score">${n}</b><span class="day-grade">${g}</span></button>`;}).join('')}</div></div><div class="cal-legend"><span>━ 빨간 윗줄 · 절입일</span><span>┄ 점선 · 공망</span><span>▣ 굵은 테두리 · 오늘</span></div><div class="calendar-note">${d.average<40?'기간 평균이 낮아 날짜 상세에 기간 내 순위를 함께 표시해요.':'점수는 예측 확률이 아닌 명리 규칙에 따른 상대 지표예요.'}</div>`;const active=$('.month-tabs .active');if(active)active.scrollIntoView({inline:'center',block:'nearest'});}
function dateItem(r,f=state.field,detail=''){const n=selectedScore(r,f),[g,color]=Saju.grade(n);return `<button class="date-item" data-detail="${r.date}" data-detail-field="${f}"><span class="date-big">${dateShort(r.date)}</span><span class="date-detail">${weekday(r.date)}요일 · ${fieldLabel(f)}<br>${detail||Saju.advice(r,f,state.data.profile.situation).do}</span><span class="date-score" style="color:${color==='#0066FF'?'#80adff':color}">${n}<small>${g}</small></span></button>`;}

function compatibilityCard(c,partner){const a=Math.floor(c.dm/2),b=Math.floor(partner.dm/2),rel=Saju.mod(b-a,5),clash=Saju.mod(c.pillars[2].z-partner.pillars[2].z,12)===6;const complemented=c.roles[b]<2&&partner.roles[a]<2;const score=Saju.clamp(50+([0,1,4].includes(rel)?10:-5)+(complemented?15:0)-(clash?12:0));return `<section class="report-section white-card"><div class="report-heading"><h2>둘이 만난 리듬</h2><small>궁합 · 보완 규칙 · B</small></div><div class="sheet-score">${score}<span>${Saju.grade(score)[0]}</span></div><p class="chart-caption">${Saju.text(c.pillars[2])} × ${Saju.text(partner.pillars[2])}</p><div class="role-explain">${complemented?'서로의 용·희신 오행을 보완하는 조합.':'용·희신의 상호 보완 여부는 제한적이에요.'}<br>${clash?'일지 충이 있어 생활 방식의 차이를 구체적으로 조율하는 해석.':'일지 정충은 없어요. 이것만으로 관계의 좋고 나쁨을 단정하지 않아요.'}</div></section>`;}
function audit(d){const c=d.chart,example=d.days.find(r=>r.date>=d.created)||d.days[0];return `<details class="audit"><summary>근거와 계산 · 검증 ${c.checks.length}항목 보기</summary><h3>명식 검증</h3><p>양력 ${c.solar} · KST ${c.input.unknown?'시각 미상':c.kst} · ${c.forward?'순행':'역행'} · ${c.startAge}세 대운 시작</p><table>${c.checks.map(v=>`<tr><td>${v.label}${v.note?'<br>'+esc(v.note):''}</td><td class="pass">${v.ok?'확인':'실패'}</td></tr>`).join('')}</table>${c.boundary?`<p>경계 출생: 가까운 절입은 ${c.nearestTerm.name} ${c.nearestTerm.time}, 출생과 ${Math.abs(c.nearestTerm.deltaMinutes)}분 차이. 절입 전후에 월주(입춘은 년주도), 2시간 경계 전후에 시주가 바뀝니다. 분 단위 원시각으로 판정했으며 천문 계산 오차 1분 내 출생은 재확인이 필요합니다.</p>`:''}${c.lateZi?'<p>23:00부터 다음 날 일주를 적용했습니다. 야자시론에서는 23:00~23:59의 일주를 당일로 보아 일주·시주의 천간 해석이 달라질 수 있습니다.</p>':''}${c.provisional?'<p>신강지수 45~55 경계: 과거 사건으로 후보를 확정하지 못해 잠정 역할표를 사용했습니다. 다른 후보의 점수는 달라질 수 있습니다.</p>':''}${c.eventComparison?`<p>과거 사건 대조: ${c.eventComparison.map(x=>(x.strong?'신강':'신약')+' 후보 적합합 '+x.fit).join(' / ')}. ${esc(c.resolvedBy||'동점으로 미확정')}</p>`:''}<h3>역할표 · 원 지침 D장</h3><table><tr><th>오행</th><th>역할</th><th>가감</th></tr>${c.roles.map((r,i)=>`<tr><td>${Saju.E[i]}</td><td>${Saju.roleNames[r]}</td><td>${Saju.roleValues[r]}</td></tr>`).join('')}</table><p>자체 점수 = 50 + 천간·지지 역할 + 상호작용 + 12운성 + 공망 + 조후. 0~100 제한.</p><p>세운 = 대운 × 0.6 + 세운 자체 × 0.4<br>월 바탕 = 대운 × 0.6 + 월운 자체 × 0.4<br>일 점수 = 일진 자체 × 0.7 + 월 바탕 × 0.3<br>분야 = 층위 점수 + 십성 보정(±25 제한)</p><h3>원국 분야 점수 · D-5</h3><table>${d.originFields.map((r,i)=>`<tr><td>${Saju.fields[i]}</td><td>${r.score} · ${Saju.grade(r.score)[0]}</td></tr>`).join('')}</table><h3>명시한 보완 규칙 · unzip.1</h3><p>신강지수: 천간 각 1, 지지 정기 각 1, 월지 정기만 3의 가중치. 일간과 같은 오행·인성 오행의 가중합 ÷ 전체 가중합 × 100. 지장간을 혼합하지 않습니다.</p><p>51 이상 신강: 용=식상, 희=재성, 한=관성, 기=비겁, 구=인성. 50 이하 신약: 용=인성, 희=비겁, 한=관성, 기=재성, 구=식상. 45~55는 경계로 표시하며 과거 사건 두 개 이상을 대조합니다. 이는 이 서비스의 공개된 점수 모델이며 유파 공통 정답은 아닙니다.</p><p>반합은 삼합·방합의 두 글자 존재, 완성 시 반합 중복 없음. 같은 관계는 관계군당 한 번, 충은 원국 위치별로 계산. 천간극 합계 ±8, 파·해·원진 합계 −8 제한. 월운은 매월 15일 12:00 KST 대표값, 일운은 해당일 12:00 KST 월주, 세운은 7월 15일 대표값입니다.</p><p>조후: 겨울(해·자·축) 화, 여름(사·오·미) 수, 가을(신·유·술) 수를 보완 오행으로 두고 해당 글자당 +5(최대 +10). 겨울 수·여름 화·가을 토만 있으면 −5. 봄은 0. 대운 시작 전은 바탕 50. 날짜 점수의 소수는 최종 반올림합니다.</p><p>원국 D-5는 분야 대표 오행(직장·이직=관성, 사업·금전=재성, 애정=배우자성, 학업·관계=인성, 건강=비겁)을 사용. 개수 0=무(−20), 1=부족(−10), 2~3=적정(+20), 4 이상=과다(+5), 정기에 있으면 통근 +5, 없으면 −5. 원국 8분야 값은 아래 상세 데이터에도 저장됩니다.</p><p>분야 보정은 지침 D-4의 천간·지지 정기 십성을 각각 확인하되 항목당 한 번 적용. 비겁·재성 과다는 원국 해당 십성 3글자 이상. 귀인·문창·도화·역마·화개는 일간/일지 기준. 건강에는 기관·질환을 추정하지 않습니다.</p><p>음력은 한국 음력 데이터 1900~2050년. 표준시는 IANA 시간대의 역사적 오프셋을 사용해 KST로 통일하며, 국내 1908년 이전은 지침의 기본 +9로 처리합니다. 진태양시 보정 없음. 절입 ±1분은 명식 확정을 멈춥니다.</p><p>업무 추천은 선택 분야 중 업무가 포함되면 전체 흐름에서도 평일·공휴일 제외. 사업자의 주말 영업은 주말만 허용하며 공휴일은 제외. 개인 시험·개인 분야는 휴일을 허용합니다. 공휴일 데이터는 ${CAL.generated} 기준이며 이후 지정되는 임시 공휴일은 별도 갱신이 필요합니다.</p>${d.profile.tasks?.length?`<p>과제 가중치: ${d.profile.tasks.map(t=>esc(t.name)+' = '+taskWeights[t.type].map((w,i)=>w?Saju.fields[i]+' '+w:'').filter(Boolean).join(' + ')).join('; ')}</p>`:''}${d.profile.partner?'<p>궁합 보완 산식: 50 + 일간 동오행·생 관계 10(극 관계 −5) + 서로 용·희신에 해당하면 15 − 일지 충 12. 0~100 제한. 두 사람의 검증된 명식으로만 계산.</p>':''}<h3>하루 계산 예시 · ${example.date}</h3><table><tr><td>기본</td><td>50</td></tr>${example.raw.logs.map(l=>`<tr><td>${l.name}</td><td>${l.value>0?'+':''}${l.value}</td></tr>`).join('')}<tr><td>0~100 제한 후 일진 자체</td><td>${example.raw.score}</td></tr><tr><td>월 바탕</td><td>${example.monthBase}</td></tr><tr><td>합성 일 점수 (반올림 전 월 바탕 사용)</td><td>${example.score}</td></tr></table><h3>계산 도구와 출처</h3><p>sxtwl 빌드 환경이 없어 지침의 보조 방식 사용: <a href="https://rhodesmill.org/pyephem/quick.html" target="_blank" rel="noopener">PyEphem 4.2.1</a> 태양의 겉보기 지심 황경·epoch=date 이분탐색. KST 절입 테이블을 파일에 포함했습니다. 일주 JDN+49 mod 60, 1949-10-01 甲子·2000-01-01 戊午 앵커 교차 확인.</p><p><a href="https://github.com/usingsky/KoreanLunarCalendar" target="_blank" rel="noopener">한국 음력 변환</a> · <a href="https://holidays.readthedocs.io/" target="_blank" rel="noopener">공휴일 데이터</a> · 규칙 버전 ${d.version}</p><p>모든 화면 숫자는 saju_data JSON에서 읽습니다. 같은 입력·날짜·규칙 버전은 같은 점수를 만듭니다. A 등급을 자동 부여하지 않으며 월·년은 기본 B, 일별·시주 불명·경계는 C입니다.</p></details>`;}
function detail(s,f=state.field,layer='day'){const d=state.data;let r=layer==='day'?[d.today,...d.days,...d.comparisons].find(x=>x.date===s):layer==='month'?d.months.find(x=>x.date===s):d.years.find(x=>x.date===s);if(!r)return;const n=selectedScore(r,f),[g,col]=Saju.grade(n),a=Saju.advice(r,f,d.profile.situation),all=d.days.map(x=>selectedScore(x,f)),percent=Math.max(1,Math.ceil(all.filter(v=>v>n).length/all.length*100));$('#sheet-content').innerHTML=`<div class="eyebrow" style="color:var(--violet)">${layer==='day'?'DAILY':layer==='month'?'MONTHLY':'YEARLY'} TRACK · ${r.confidence}</div><h2 id="sheet-title" class="sheet-title">${s.replaceAll('-','.')} ${layer==='day'?weekday(s)+'요일':''} · ${fieldLabel(f)}</h2><div class="sheet-score" style="color:${col==='#C9D1DB'?'#6c7a90':col}">${n}<span>${g}</span></div><p class="sheet-meta">${Saju.text(r.raw.pair)} · ${d.average<40?'기간 내 상위 '+percent+'% · ':''}${r.holiday?esc(r.holiday)+' · ':''}확신도 ${r.confidence}</p><div class="sheet-bars">${r.fields.map((v,i)=>`<div class="sheet-bar"><span>${Saju.fields[i]}</span><div class="track"><div class="fill" style="width:${v.score}%;background:${Saju.grade(v.score)[1]}"></div></div><b>${v.score}</b></div>`).join('')}</div><div class="sheet-advice"><p><b>할 것</b>${a.do}</p><p><b>피할 것</b>${a.avoid}</p></div><p class="sheet-relationship">${r.raw.logs.filter(l=>/합|충|형|조후/.test(l.name)).slice(0,3).map(l=>`${l.name} ${l.value>0?'+':''}${l.value}`).join(' · ')||'주요 합·충·형 가감 없음'}<br>원국·대운과의 관계를 점수 규칙으로 환산했어요.</p><details class="sheet-logs"><summary>이 날짜의 가감점 확인</summary>기본 50<br>${r.raw.logs.map(l=>esc(l.name)+' '+(l.value>0?'+':'')+l.value).join('<br>')}<br>월 바탕 ${r.monthBase} / 대운 ${r.daewoon}${f!=='all'?'<br>분야 보정 '+r.fields[+f].correction+'<br>'+r.fields[+f].logs.map(l=>l.name+' '+l.value).join('<br>'):''}</details>`;$('#sheet').showModal();$('#sheet').scrollTop=0;}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('파일을 저장했어요.');}
function downloadReport(){const d=state.data,clone=document.documentElement.cloneNode(true);clone.querySelector('#saved-report')?.remove();clone.querySelector('#sheet').removeAttribute('open');clone.querySelector('#sheet-content').innerHTML='';clone.querySelector('#toast').textContent='';clone.querySelector('#toast').classList.remove('show');let html='<!doctype html>\n'+clone.outerHTML;const saved=`<script id="saved-report" type="application/json">${JSON.stringify(d).replace(/</g,'\\u003c')}<\/script>`;html=html.replace('<script id="calendar-data"',saved+'<script id="calendar-data"');download(html,`사주_${d.chart.input.name.replace(/[^\p{L}\p{N}_-]/gu,'')}_${d.profile.period}.html`,'text/html');}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action],[data-month],[data-month-move],[data-filter],[data-list],[data-detail],[data-flow-detail]');if(!btn)return;if(btn.dataset.action){const a=btn.dataset.action;if(a==='home'){state.snapshot=false;home();}if(a==='start'){state.snapshot=false;state.birth={calendar:'solar',gender:'',zone:'Asia/Seoul'};birth();}if(a==='birth')birth();if(a==='sample')sample();if(a==='interview')interview();if(a==='download-html')downloadReport();if(a==='download-json')download(JSON.stringify(state.data,null,2),`saju_data_${state.data.chart.input.name.replace(/[^\p{L}\p{N}_-]/gu,'')}.json`,'application/json');}if(btn.dataset.month){state.month=btn.dataset.month;renderCalendar();}if(btn.dataset.monthMove){const i=state.data.months.findIndex(r=>r.key===state.month),r=state.data.months[i+Number(btn.dataset.monthMove)];if(r){state.month=r.key;renderCalendar();}}if(btn.dataset.filter){state.field=btn.dataset.filter;renderCalendar();renderDates();}if(btn.dataset.list){state.list=btn.dataset.list;$$('[data-list]').forEach(x=>x.classList.toggle('active',x===btn));renderDates();}if(btn.dataset.detail)detail(btn.dataset.detail,btn.dataset.detailField||state.field);if(btn.dataset.flowDetail)detail(btn.dataset.flowDetail,'all',btn.dataset.layer);});
$('.wordmark').onclick=e=>{e.preventDefault();home();};$('.nav-how').onclick=e=>{if(state.view!=='home'){e.preventDefault();home();$('#how').scrollIntoView({behavior:'smooth'});}};
$('.sheet-close').onclick=()=>$('#sheet').close();$('#sheet').onclick=e=>{if(e.target===$('#sheet')){const r=$('#sheet').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#sheet').close();}};let dragY=null;$('#sheet').addEventListener('pointerdown',e=>{if(e.target.classList.contains('sheet-handle'))dragY=e.clientY;});$('#sheet').addEventListener('pointerup',e=>{if(dragY!==null&&e.clientY-dragY>55)$('#sheet').close();dragY=null;});
const saved=$('#saved-report');if(saved){try{state.data=JSON.parse(saved.textContent);state.chart=state.data.chart;state.birth=state.chart.input;state.profile=state.data.profile;state.month=state.data.months[0].key;state.snapshot=true;renderReport();}catch{home();}}else home();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.view==='report'&&!state.snapshot&&state.data.created!==Saju.today()){state.data=Saju.report(state.chart,state.profile);state.month=state.data.months[0].key;renderReport(false);toast('오늘 날짜로 리포트를 갱신했어요.');}});
</script>
</body></html>
